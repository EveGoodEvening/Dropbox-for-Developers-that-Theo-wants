[package]
name = "fs2-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fs2-core = { path = "../fs2-core" }
fs2-crypto = { path = "../fs2-crypto" }
fs2-rules = { path = "../fs2-rules" }
fs2-daemon = { path = "../fs2-daemon" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.24"
url = "2"

[dev-dependencies]
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
fs2-backend = { path = "../fs2-backend" }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
