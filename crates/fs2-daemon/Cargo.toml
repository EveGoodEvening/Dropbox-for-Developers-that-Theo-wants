[package]
name = "fs2-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Local daemon owning metadata DB, cache, queues, sync loops."

[lints]
workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs2-core = { path = "../fs2-core" }
fs2-sync = { path = "../fs2-sync" }
fs2-rules = { path = "../fs2-rules" }
fs2-env = { path = "../fs2-env" }
fs2-crypto = { path = "../fs2-crypto" }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
fs2-cli = { path = "../fs2-cli" }
