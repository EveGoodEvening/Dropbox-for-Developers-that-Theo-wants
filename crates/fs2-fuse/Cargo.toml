[package]
name = "fs2-fuse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "FUSE filesystem adapter (macOS macFUSE / Linux FUSE3)."

[lints]
workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
fs2-core = { path = "../fs2-core" }
fs2-sync = { path = "../fs2-sync" }
fs2-crypto = { path = "../fs2-crypto" }
fuser = { version = "0.14", default-features = false }
libc = "0.2"
parking_lot = "0.12"
tracing = "0.1"
thiserror = "1"
chrono = "0.4"

[dev-dependencies]
chrono = "0.4"
