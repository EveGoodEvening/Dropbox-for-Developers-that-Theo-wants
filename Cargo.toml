[workspace]
members = [
    "crates/fs2-core",
    "crates/fs2-cli",
    "crates/fs2-daemon",
    "crates/fs2-fuse",
    "crates/fs2-sync",
    "crates/fs2-rules",
    "crates/fs2-env",
    "crates/fs2-git",
    "crates/fs2-crypto",
    "crates/fs2-backend",
    "crates/fs2-testkit",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/fs2-devsync"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
